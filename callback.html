<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth Callback | Japan in 60</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.8; color: #222; }
  code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .row { margin: 12px 0; }
  .label { font-weight: bold; }
</style>
</head>
<body>
  <p><a href="./index.html">&larr; Back to home</a></p>
  <h1>Authorization Callback</h1>
  <p>When the TikTok authorization flow completes, you'll be redirected here with parameters appended. Copy the values below to complete the token exchange.</p>
  <div id="params"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const container = document.getElementById("params");
    if ([...params].length === 0) {
      container.textContent = "No parameters present.";
    } else {
      for (const [key, value] of params) {
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = '<span class="label">' + key + ':</span> <code>' + value + "</code>";
        container.appendChild(div);
      }
    }
  </script>
</body>
</html>
